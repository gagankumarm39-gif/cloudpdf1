# Nginx Reverse Proxy Configuration for Cloud-Based PDF Generation System
# Upstream Gunicorn Application Server
upstream cloudpdf_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your EC2 Elastic IP, Public DNS, or custom domain

    # Maximum payload size for document generation requests (large text, embeds)
    client_max_body_size 25M;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Logging
    access_log /var/log/nginx/cloudpdf_access.log;
    error_log /var/log/nginx/cloudpdf_error.log warn;

    # Basic Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow embedding PDFs inside iframes from same origin for M3 preview
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Direct Static Asset Delivery (Bypasses Python Gunicorn for optimal speed)
    location /static/ {
        alias /opt/cloudpdfgenerator/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Health Check Endpoint (Direct forwarding for AWS ALB / Target Group probes)
    location = /api/health {
        proxy_pass http://cloudpdf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Proxy all other requests to Gunicorn WSGI
    location / {
        proxy_pass http://cloudpdf_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extended timeouts for PDF compilation
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
